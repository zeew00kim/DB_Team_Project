<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Bikes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <!-- 동적으로 제목을 업데이트 -->
    <div class="categoryHeader">
        <h1 id="header-title">&lt; 원하는 카테고리를 선택 &gt;</h1>
        <p id="brand-message"></p> <!-- 브랜드 관련 문구 -->
    </div>

    <div class="formContainer">
        <form id="search-form">
            <table class="inputTable">
                <tr>
                    <th>카테고리</th>
                    <td>
                        <select id="type-name" name="type-name" multiple></select>
                    </td>
                </tr>
                <tr>
                    <th>서브 카테고리</th>
                    <td>
                        <select id="subtype-name" name="subtype-name" multiple></select>
                    </td>
                </tr>
                <tr>
                    <th>프레임 재질</th>
                    <td>
                        <select id="frame-material" name="frame-material" multiple></select>
                    </td>
                </tr>
                <tr>
                    <th>휠 재질</th>
                    <td>
                        <select id="wheel-material" name="wheel-material" multiple></select>
                    </td>
                </tr>
            </table>
            <div class="buttonContainer">
                <button type="button" class="categoryButton" onclick="searchBikes()">
                    조 회 🔍
                </button>
            </div>
        </form>
    </div>

    <!-- 검색 결과를 표시할 영역 -->
    <div id="results" style="margin: 20px;"></div>

    <footer>
        DB_Team_Project_2024
    </footer>

    <script>
        // URL의 쿼리 파라미터에서 값을 가져오는 함수
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        // 브랜드 이름에 따라 제목과 문구 업데이트
        function updateHeaderAndMessage() {
            const brand = getQueryParam('brand');
            const headerTitle = document.getElementById('header-title');
            const brandMessage = document.getElementById('brand-message');

            if (brand) {
                headerTitle.innerHTML = `&lt; ${brand} 자전거 검색 페이지 &gt;`;
                brandMessage.textContent = `${brand} 브랜드의 자전거를 조회합니다. 아래에서 원하는 검색 조건을 선택하세요😁`;
                brandMessage.style.textAlign = 'center';
                brandMessage.style.marginTop = 0;
                brandMessage.style.fontWeight = 'bold';
                brandMessage.style.fontSize = '20px';
            }
        }

        // 검색 버튼 클릭 시 선택한 카테고리를 콘솔에 출력 (추후 검색 API 호출 가능)
        function searchBikes() {
            const form = document.getElementById('search-form');
            const formData = new FormData(form);
            const selectedCategories = {};
            for (const pair of formData.entries()) {
                if (!selectedCategories[pair[0]]) selectedCategories[pair[0]] = [];
                selectedCategories[pair[0]].push(pair[1]);
            }
            console.log('선택된 값:', selectedCategories);
        }

        // API 데이터를 가져와 멀티 셀렉트 박스에 채우기
        function populateSelect(url, selectId) {
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    const selectElement = document.getElementById(selectId);
                    selectElement.innerHTML = ""; // 기존 옵션 초기화
                    data.forEach(item => {
                        const option = document.createElement("option");
                        option.value = item.name || item.type_name || item.subtype_name || item.material_name;
                        option.textContent = item.name || item.type_name || item.subtype_name || item.material_name;
                        selectElement.appendChild(option);
                    });
                })
                .catch(error => console.error(`Error fetching data for ${selectId}:`, error));
        }

        // 페이지 로드 시 각 셀렉트 박스에 데이터 추가
        document.addEventListener("DOMContentLoaded", () => {
            populateSelect("/bikeTypes", "type-name"); // 카테고리
            populateSelect("/bikeSubTypes", "subtype-name"); // 서브 카테고리
            populateSelect("/materials", "frame-material"); // 프레임 재질
            populateSelect("/materials", "wheel-material"); // 휠 재질
        });

        // 페이지 로드 시 제목과 문구 업데이트 실행
        document.addEventListener('DOMContentLoaded', updateHeaderAndMessage);
    </script>
</body>
</html>
