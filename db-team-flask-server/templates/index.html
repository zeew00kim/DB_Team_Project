<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bike Information System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="header">
        <h1>[ 자전거 정보 조회 시스템 ]</h1>
    </div>

    <!-- 브랜드 로고 섹션 -->
    <div id="brand-logos">
        {% for brand in brands %}
        <div>
            {% if brand.image_path %}
            <img src="{{ url_for('static', filename=brand.image_path.replace('static/', '')) }}" 
                 alt="{{ brand.brand_name }}" 
                 class="brand-logo" 
                 onclick="navigateToSearchPage('{{ brand.brand_id }}')"
                 style="background-color: white">
            {% else %}
            <div class="no-image">
                <span>이미지 없음</span>
            </div>
            {% endif %}
        </div>
        {% endfor %}
    </div>

    <!-- 관리자 입력 섹션 -->
    <div id="admin-section">
        <input type="text" id="admin-code" placeholder="관리자 코드를 입력하세요">
        <button onclick="validateAdminCode()">관리자 접속</button>
        <p id="error-message" style="color: red; display: none;">잘못된 코드입니다 🥺</p>
    </div>

    <footer>
        DB_Team_Project_2024
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
