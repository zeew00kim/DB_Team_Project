<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 테이블 조회 페이지</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='adminPage.css') }}">
</head>
<body>
    <div class="header">
        <h1>&lt; 등록된 자전거 정보 조회 &gt;</h1>
    </div>
    
    <h2><a href="#">Bike 테이블</a></h2>
    <table class="table" id="bikeTable">
        <thead>
            <tr>
                <th>Bike ID</th>
                <th>Subtype ID</th>
                <th>Brand ID</th>
                <th>Price</th>
                <th>Frame Material ID</th>
                <th>Wheel Material ID</th>
                <th>Bike Name</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <h2><a href="#">BikeType 테이블</a></h2>
    <table class="table" id="bikeTypeTable">
        <thead>
            <tr>
                <th>Type ID</th>
                <th>Type Name</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <h2><a href="#">BikeSubType 테이블</a></h2>
    <table class="table" id="bikeSubTypeTable">
        <thead>
            <tr>
                <th>Subtype ID</th>
                <th>Type ID</th>
                <th>Subtype Name</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <h2><a href="#">Brand 테이블</a></h2>
    <table class="table" id="brandTable">
        <thead>
            <tr>
                <th>Brand ID</th>
                <th>Brand Name</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <h2><a href="#">Material 테이블</a></h2>
    <table class="table" id="materialTable">
        <thead>
            <tr>
                <th>Material ID</th>
                <th>Material Name</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script src="{{ url_for('static', filename='adminPage.js') }}"></script>
</body>
</html>
